components:
  parameters:
    # headers:
    side:
      in: header
      name: X-Side
      required: true
      description: Сторона - сотрудник (employee) или компания (company)
      schema:
        type: string
        enum:
          - employee
          - company
    user:
      in: header
      name: X-User-Id
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
    query-employee-id:
      in: query
      name: employee_id
      schema:
        type: string
        format: uuid
      required: true
    # path params
    service-doc-type:
      in: path
      name: service_doc_type
      description: "Тип документа для ознакомления. Например: user_agreement, policy_confidentiality."
      schema:
        type: string
      required: true
    company-id:
      in: path
      name: company_id
      schema:
        type: string
        format: uuid
      required: true
      description: Company ID
    unit-id:
      in: path
      name: unit_id
