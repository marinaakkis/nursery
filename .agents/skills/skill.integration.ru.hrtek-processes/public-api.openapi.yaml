openapi: "3.0.2"
info:
  version: 1.0.1
  title: VK HR Tek - public api service
servers:
  - url: https://{host}/api/{basePath}
    variables:
      host:
        default: 'public-api.vkdoc.mail.ru'
      basePath:
        default: v1
paths:
  /user/by_snils:
    get:
      parameters:
        - in: query
          name: snils
          schema:
            type: string
          required: true
          description: СНИЛС
      description: Получение идентификатора пользователя по СНИЛСу
      tags:
        - user
      security:
        - ApiKeyAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBySnilsResponse"
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/phone/init:
    parameters:
      - $ref: '#/components/parameters/user'
    post:
      description: Инициализация сохранения номера телефона для пользователя, инициирует отправку SMS с кодом
      tags:
        - user
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/UserPhoneInitRequest"
      responses:
        '200':
          description: OK
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidPhoneToNotify: { $ref: "#/components/examples/InvalidPhoneToNotify" }
                NotifyRateLimit: { $ref: "#/components/examples/NotifyRateLimit" }
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/phone/verify:
    parameters:
      - $ref: '#/components/parameters/user'
    post:
      description: Подтверждение телефона SMS-кодом
      tags:
        - user
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        content:
          'application/json':
            schema:
              $ref: "#/components/schemas/PhoneVerifyRequest"
      responses:
        '200':
          description: OK
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InvalidPhoneCode: { $ref: "#/components/examples/InvalidPhoneCode" }
                NotifyRateLimit: { $ref: "#/components/examples/NotifyRateLimit" }
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user:
    parameters:
      - $ref: '#/components/parameters/user'
    get:
      description: Получение информации о пользователе
      tags:
        - user
      security:
        - ApiKeyAuth: [ ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/certificate/init:
    parameters:
      - $ref: '#/components/parameters/user'
    post:
      description: "Контур: отправка SMS для подтверждения выпуска УНЭПа только. КриптоПро: продверждение выпуска сертификата."
      security:
        - ApiKeyAuth: [ ]
      tags:
        - certificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateInitRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/certificate/verify:
    parameters:
      - $ref: '#/components/parameters/user'
    post:
      description: Подтверждение выпуска УНЭПа SMS-кодом только для Контура
      security:
        - ApiKeyAuth: [ ]
      tags:
        - certificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateVerifyRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/certificate/info/{user_id}:
    parameters:
      - $ref: '#/components/parameters/user'
    post:
      description: Получение информации активного УНЭП сертификата пользователя с ошибками Контура
      security:
        - ApiKeyAuth: [ ]
      tags:
        - certificate
      parameters:
        - $ref: '#/components/parameters/user-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfoResponse'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/certificate/application:
    parameters:
      - $ref: '#/components/parameters/user'
    get:
      description: Файл заявления на выпуск УНЭПа
      security:
        - ApiKeyAuth: [ ]
      tags:
        - certificate
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
      description: Создание Заявки
      tags:
        - event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /event/list:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
      description: Получение списка заявок
      tags:
        - event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventListRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/export:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
      description: Запустить задачу по экспорту списка заявок в файл
      tags:
        - event
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: ["events", "documents"]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventListExportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListExportResponse'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/create_options:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    get:
      security:
        - ApiKeyAuth: [ ]
      description: Список типов Заявок, которые может создать сотрудник
      tags:
        - event
      parameters:
        - in: query
          name: event_type_group
          required: false
          description: Идентификатор группы типа Заявки
          schema:
            type: string
            format: uuid
        - in: query
          name: employee_id
          required: false
          description: Идентификатор сотрудника
          schema:
            type: string
            format: uuid
        - in: query
          name: personnel_number
          required: false
          description: Уникальный идентификатор сотрудника во внешней системе
          schema:
            type: string
        - in: query
          name: legal_id
          required: false
          description: Уникальный идентификатор компании
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventOptionsList'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/create_options/event_type:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    get:
      security:
        - ApiKeyAuth: [ ]
      description: Настройки создания конкретного типа мероприятия
      tags:
        - event
      parameters:
        - in: query
          name: event_type_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCreateOptionsResponse'

  /event/create_options/event_type/participant_options:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    get:
      security:
        - ApiKeyAuth: [ ]
      description: Получение списка возможных исполнителей для роли в заявке
      tags:
        - event
      parameters:
        - in: query
          name: event_type_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: role_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          required: false
          description: поиск по фио и табельному
          schema:
            type: string
            minLength: 3
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeParticipantOptionsResponse'

  /event/available_filters:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    get:
      security:
        - ApiKeyAuth: [ ]
      description: Список фильтров для листинга Заявок
      tags:
        - event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableFilters'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/{event_id}:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    get:
      tags:
        - event
      security:
        - ApiKeyAuth: [ ]
      description: Получение информации о Заявке
      parameters:
        - $ref: '#/components/parameters/event-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/{event_id}/{node_id}/upload:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
      description: Загрузка документа в Заявку
      tags:
        - action
      parameters:
        - $ref: '#/components/parameters/event-id'
        - $ref: '#/components/parameters/node-id'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/{event_id}/{node_id}/accept:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
      description: Согласование Заявки
      tags:
        - action
      parameters:
        - $ref: '#/components/parameters/event-id'
        - $ref: '#/components/parameters/node-id'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Переданы невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Запрещено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Серверная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /event/{event_id}/{node_id}/decline:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
      description: Отклонить
      operationId: DoDecline
      tags:
        - action
      parameters:
        - $ref: '#/components/parameters/event-id'
        - $ref: '#/components/parameters/node-id'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeclineRequest'
      responses:
        200:
          description: OK

  /event/{event_id}/{node_id}/decline_sign:
    parameters:
      - $ref: '#/components/parameters/side'
      - $ref: '#/components/parameters/user'
    post:
      security:
        - ApiKeyAuth: [ ]
