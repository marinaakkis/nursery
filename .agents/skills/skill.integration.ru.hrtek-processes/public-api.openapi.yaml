    CertificateStatus:
      type: string
      example: released
      enum:
        - waiting_to_create #ожидает создания
        - need_verify #ожидает подписания
        - verifying #проверка подписания
        - waiting_confirmation #ожидает подтверждения в ЕСИА
        - released #успешно выпущен
        - expired #истек срок действия
        - error #ошибка выпуска УНЭПа
        - release_paused #ручная проверка данных
      description: >
        Контур. Информация о статусе выпуска УНЭПа:
          * `waiting_to_create` - ожидает создания заявления на выпуск УНЭП (проверки СМЭВ и пр)
          * `need_verify` - ожидает подписания (пользователь должен инициировать старт выпуска заявления на выпуск УНЭП)
          * `verifying` - проверка подписания
          * `waiting_confirmation` - ожидает подтверждения в ЕСИА
          * `released` - УНЭП успешно выпущен
          * `expired` - у сертификата истек срок действия
          * `error` - ошибка выпуска УНЭПа
          * `release_paused` - ручная проверка данных
        
        КриптоПро DSS Simple:
          * waiting_to_create - ожидаем асинхронное создание сертификата.
          * need_verify - ожидаем подтверждения пользователем.
          * verifying - сертификат выпускается (Оператор асинхронно одобряет заявление).
          * released - сертификат выпущен.
          * expired - сертификат истек.
          * error - ошибка выпуска сертификата.

    CertificateReleaseMethod:
      type: string
      example: sms
      enum:
        - sms
        - esia
      description: >
        Способ выпуска УНЭП:
          * `sms` - Подпись заявления на выпуск УНЭП через SMS
          * `esia` - Подпись заявления через подтверждение личности на Госуслугах

