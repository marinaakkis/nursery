####################################
##    SECURITY PART FOR SANDBOX   ##
####################################
# more info about configuration: https://gitlab.biocad.ru/explore/catalog/iac/ci-components/main
---
include:
  - component: $CI_SERVER_HOST/iac/ci-components/main/ci@2.1.3
    inputs:
      security-ci-stage: test
      security-ci-gitlab-ultimate-stage: test
      megalinter-stage: ".post"
      megalinter-report-stage: ".post"
      renovate-base-branches: master
      renovate-rules:
        - if: $CI_COMMIT_MESSAGE =~ /Merge branch.*renovate\//
          when: on_success
        - if: '$CI_COMMIT_BRANCH == "master"'
          when: manual
          allow_failure: true
        - when: never
      security-ci-gitlab-ultimate-dast-target-url: ''
      security-ci-gitlab-ultimate-api-security-target-url: ''
      security-ci-gitlab-ultimate-api-fuzzing-target-url: ''

variables:
  SECURITY_GITLAB_CI_ULTIMATE_ENABLED: "true"
####################################
stages: [test]
####################################

deploy-skills-sync:
  stage: test
  image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/skills/sync-deploy-skills.mjs --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - when: on_success

deploy-skills-update-mr:
  stage: test
  image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
  before_script:
    - apk add --no-cache git
  script:
    - node scripts/skills/create-deploy-skills-mr.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
